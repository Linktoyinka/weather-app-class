<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/weather.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Weather App</h1>
        <p>Check the weather anywhere in the world</p>

        <p id="message"></p>
      </header>

      <form id="search-form" class="search-box">
        <input
          type="text"
          id="city-input"
          placeholder="Enter city name"
          required
        />

        <button type="submit">search</button>
      </form>

      <!-- current weather -->
      <section id="weather-section" class="weather-section">
        <div class="location">
          <h2 id="city-name">City Name</h2>
          <p id="date">Date</p>
        </div>

        <div class="main-weather">
          <div>
            <span id="weather-icon">☀️</span>
          </div>

          <div>
            <h3 id="temperature">--°C</h3>
            <p id="weather-description">Weather Condition</p>
            <p>Feels like</p>
            <p id="feels-like">--°C</p>
          </div>

          <div class="weather-details">
            <div class="detail-card">
              <p>Humidity</p>
              <p id="humidity">--%</p>
            </div>

            <div class="detail-card">
              <p>Wind Speed</p>
              <p id="wind">--km/h</p>
            </div>

            <div class="detail-card">
              <p>Precipitation</p>
              <p id="precipitation">--mm</p>
            </div>
          </div>

          <div class="forecast-section">
            <h5>5-days Forecast</h5>

            <div class="forecast-grid" id="forecast">
              <!-- Forecast cards will be dynamically added here -->
          </div>
        </div>
      </section>

      


      <footer>
        <p>Weather App &copy; 2024</p>
      </footer>
    </div>

    <script src="/weather.js"></script>
  </body>
</html>
